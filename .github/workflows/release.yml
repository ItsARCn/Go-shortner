name: Release Builds

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Standalone Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Sync Frontend Assets to Embedded Package
        run: |
          mkdir -p backend/internal/embedded/public
          cp -r frontend/public/* backend/internal/embedded/public/

      - name: Run Automated Tests
        run: |
          cd backend
          go test -v ./...

      - name: Build Linux amd64 Standalone Binary
        run: |
          mkdir -p dist
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/go-shortener-linux-amd64 ./cmd/server/main.go

      - name: Build Linux arm64 Standalone Binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/go-shortener-linux-arm64 ./cmd/server/main.go

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum go-shortener-linux-amd64 go-shortener-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/go-shortener-linux-amd64
            dist/go-shortener-linux-arm64
            dist/checksums.txt
            scripts/install.sh
            scripts/uninstall.sh
            scripts/go-shortener.service
          generate_release_notes: true
