name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Sync Frontend Assets to Embedded Package
        run: |
          mkdir -p backend/internal/embedded/public
          cp -r frontend/public/* backend/internal/embedded/public/

      - name: Run Tests
        run: |
          cd backend
          go test -v ./...

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Sync Frontend Assets to Embedded Package
        run: |
          mkdir -p backend/internal/embedded/public
          cp -r frontend/public/* backend/internal/embedded/public/

      - name: Build Linux amd64 Standalone Binary
        run: |
          mkdir -p dist
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/go-shortener-linux-amd64 ./cmd/server/main.go

      - name: Build Linux arm64 Standalone Binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/go-shortener-linux-arm64 ./cmd/server/main.go

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum go-shortener-linux-amd64 go-shortener-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Determine Release Tag
        id: tag_step
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_step.outputs.release_tag }}
          name: Release ${{ steps.tag_step.outputs.release_tag }}
          files: |
            dist/go-shortener-linux-amd64
            dist/go-shortener-linux-arm64
            dist/checksums.txt
            scripts/install.sh
            scripts/uninstall.sh
            scripts/go-shortener.service
          generate_release_notes: true
