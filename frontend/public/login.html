<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GO Shortener</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <span>GO</span>
      <span class="brand-badge">PRO</span>
    </a>
    <nav class="nav-links">
      <a href="/register" class="nav-link nav-btn">Sign Up</a>
    </nav>
  </header>

  <main>
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Enter your credentials to access your link dashboard.</p>
      </div>

      <div id="auth-error" class="error-banner"></div>

      <button type="button" id="google-login-btn" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        Continue with Google
      </button>

      <div class="auth-divider">or continue with email</div>

      <form id="login-form">
        <div class="input-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="url-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="url-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="shorten-btn" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register" class="auth-link">Create one</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-copy">
      &copy; 2026 GO Shortener. Minimal. Fast. Controlled.
    </div>
  </footer>

  <script>
    const errEl = document.getElementById('auth-error');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      errEl.textContent = '';
      errEl.classList.remove('show');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Failed to log in';
          errEl.classList.add('show');
          return;
        }
        window.location.href = '/dashboard';
      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    let firebaseReady = false;

    // Load Firebase Web App configuration dynamically from backend
    fetch('/api/auth/firebase-config')
      .then(r => r.json())
      .then(cfg => {
        if (cfg && cfg.enabled && cfg.api_key) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp({
                apiKey: cfg.api_key,
                authDomain: cfg.auth_domain,
                projectId: cfg.project_id,
                storageBucket: cfg.storage_bucket,
                messagingSenderId: cfg.messaging_sender_id,
                appId: cfg.app_id
              });
            }
            firebaseReady = true;
          } catch (e) {
            console.warn('Firebase init:', e);
          }
        }
      })
      .catch(() => {});

    document.getElementById('google-login-btn').addEventListener('click', async () => {
      errEl.textContent = '';
      errEl.classList.remove('show');

      if (firebaseReady) {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          const result = await firebase.auth().signInWithPopup(provider);
          const idToken = await result.user.getIdToken();

          const res = await fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_token: idToken })
          });
          const data = await res.json();
          if (!res.ok) {
            errEl.textContent = data.error || 'Google login failed';
            errEl.classList.add('show');
            return;
          }
          window.location.href = '/dashboard';
        } catch (err) {
          if (err.code === 'auth/popup-closed-by-user') return;
          errEl.textContent = err.message || 'Google sign-in error';
          errEl.classList.add('show');
        }
      } else {
        // Fallback for local development or before Firebase is configured in .env
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          const promptEmail = prompt("Enter Google Email to test Google OAuth Login (Dev Mode):", "google.user@example.com");
          if (!promptEmail) return;

          const dummyToken = btoa(JSON.stringify({alg:"none"})) + "." +
            btoa(JSON.stringify({
              sub: "google-uid-" + Math.random().toString(36).substring(2, 9),
              email: promptEmail,
              name: "Google User",
              exp: Math.floor(Date.now() / 1000) + 3600
            })) + ".sig";

          try {
            const res = await fetch('/api/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id_token: dummyToken })
            });
            const data = await res.json();
            if (!res.ok) {
              errEl.textContent = data.error || 'Google login failed';
              errEl.classList.add('show');
              return;
            }
            window.location.href = '/dashboard';
          } catch (err) {
            errEl.textContent = 'Google sign-in error';
            errEl.classList.add('show');
          }
        } else {
          errEl.textContent = 'Google Sign-In requires Firebase configuration. Please configure FIREBASE_* variables in your server .env file.';
          errEl.classList.add('show');
        }
      }
    });
  </script>
</body>
</html>
