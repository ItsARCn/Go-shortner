<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GO Shortener</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <a href="/" class="brand">
      <span>GO</span>
      <span class="brand-badge">PRO</span>
    </a>
    <nav class="nav-links">
      <a href="/register" class="nav-link nav-btn">Sign Up</a>
    </nav>
  </header>

  <main>
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome back</h2>
        <p>Enter your credentials to access your link dashboard.</p>
      </div>

      <div id="auth-error" class="error-banner"></div>

      <form id="login-form">
        <div class="input-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="url-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="url-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-btn" class="shorten-btn" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register" class="auth-link">Create one</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-copy">
      &copy; 2026 GO Shortener. Minimal. Fast. Controlled.
    </div>
  </footer>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('auth-error');
      const btn = document.getElementById('login-btn');
      errEl.textContent = '';
      errEl.classList.remove('show');

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Failed to log in';
          errEl.classList.add('show');
          return;
        }
        window.location.href = '/dashboard';
      } catch (err) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
